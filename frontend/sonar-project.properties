# Must be unique in a given SonarQube instance 
sonar.host.url=http://seralu4.esi.uclm.es:1521/
sonar.projectKey=2026-g02-frontend
# This is the name and version displayed in the SonarQube UI. 
# Was mandatory prior to SonarQube 6.1.
sonar.projectName=2026-g02-frontend
sonar.projectVersion=1.0
sonar.token=squ_afe00bd098873a9edebb01fab28d235d79353039

#Exclusions to not be analyzed by SonarQube

#Mocks
sonar.exclusions=**/public/mockServiceWorker.js,**/src/mocks/**

# Encoding of the source code. Default is default system encoding 
sonar.sourceEncoding=UTF-8

# Source and test code (test files and helpers live next to the code in src)
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.js,**/*.test.jsx,src/test/**

# Coverage report generated by "npm run test:coverage" (Vitest, LCOV format)
sonar.javascript.lcov.reportPaths=coverage/lcov.info